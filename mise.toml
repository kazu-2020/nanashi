# The tool versions for local development and CI. Run "mise install" in the repository root.
[tools]
go = "1.27.1"
rust = { version = "1.99.0", components = "clippy,rust-analyzer" }  # rust-analyzer is the LSP server for the rust-analyzer-lsp plugin
python = "3.14.6"
node = "26.10.0"
# Node 25 and later do not include corepack. Keep the same version in "packageManager" of web/package.json.
# Get pnpm from the npm registry, not from GitHub releases.
"npm:pnpm" = "12.9.1"
# The LSP servers for the gopls-lsp and typescript-lsp plugins. CI does not install them.
# typescript-language-server uses the TypeScript in web/node_modules.
"go:golang.org/x/tools/gopls" = "0.23.0"
"npm:typescript-language-server" = "6.0.1"

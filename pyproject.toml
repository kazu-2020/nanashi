[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nanashi"
version = "0.1.0"
description = "計画ツールのための、疎な多次元計算エンジン"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
rust = ["nanashi_core"]            # native/ を maturin でビルドしたもの（README の手順）
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["maturin>=1.15,<2", "psycopg[binary]>=3.2,<4", "pyflakes>=3"]

[tool.setuptools]
packages = ["sparse_engine"]

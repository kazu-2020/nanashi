version: v2
modules:
  - path: proto
lint:
  use: [STANDARD]
  # PlanService shares small responses (Ack, the definitions) between RPCs, so that the contract stays small.
  except: [RPC_REQUEST_RESPONSE_UNIQUE, RPC_RESPONSE_STANDARD_NAME]
  # proto/buf/validate/ is a copy of protovalidate v1.2.0. It agrees with the Go module buf.build/go/protovalidate in
  # api/go.mod. The copy lets buf generate run without the network.
  ignore: [proto/buf]

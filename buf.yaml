version: v2
modules:
  - path: proto
# Use the commit that agrees with the Go module buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go in api/go.mod.
deps:
  - buf.build/bufbuild/protovalidate:435963d1631043e694e56e6bcc3c79c3
lint:
  use: [STANDARD]
  # PlanService shares small responses (Ack, the definitions) between RPCs, so that the contract stays small.
  except: [RPC_REQUEST_RESPONSE_UNIQUE, RPC_RESPONSE_STANDARD_NAME]

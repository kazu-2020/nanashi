name: tessera-test

# Start only when tessera/ or this file changes.
on:
  push:
    branches: [main]  # ほかのブランチは pull_request で回す（push と二重に回さない）
    paths: &paths
      - tessera/**
      - .github/workflows/tessera-test.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:  # 同じ PR に続けて push したら、古いほうの実行は止める
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-10-19 に Ubuntu 26 へ移るので、版を固定する
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14t"]  # 通常の Python と free-threaded の Python
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nanashi
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      s3:  # S3 互換のオブジェクトストレージ（compose.yaml と同じ）
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: nanashi
          RUSTFS_SECRET_KEY: nanashi-secret
        ports: ["59000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NANASHI_PG_DSN: postgresql://postgres@127.0.0.1:55432/nanashi
      NANASHI_S3_ENDPOINT: http://127.0.0.1:59000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: ビルドした Rust のエンジンを取り出す  # native/ が変わっていなければ、ビルドを省く
        id: wheel
        uses: actions/cache@v6
        with:
          path: tessera/wheelhouse
          key: nanashi-core-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('tessera/native/Cargo.toml', 'tessera/native/Cargo.lock', 'tessera/native/pyproject.toml', 'tessera/native/src/**', 'tessera/native/engine/Cargo.toml', 'tessera/native/engine/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.wheel.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.wheel.outputs.cache-hit != 'true'
        with:
          workspaces: tessera/native
      - name: 依存を入れて Rust のエンジンをビルドする
        working-directory: tessera
        run: |
          sudo apt-get install -y libpq5  # 純 Python 版の psycopg が使う
          python -m pip install -e ".[dev]"
          if [ ! -d wheelhouse ]; then
            python -m pip wheel --no-build-isolation --no-deps ./native -w wheelhouse  # maturin でビルドする
          fi
          python -m pip install wheelhouse/nanashi_core-*.whl
      # テストはモジュールごとに別のプロセスで並べて回す（tests/parallel.py）。待ち時間が多いので、順に回すより速い
      - name: 参照実装でテストする
        working-directory: tessera
        run: SPARSE_ENGINE=reference python -m tests.parallel
      - name: Rust のエンジンでテストする
        working-directory: tessera
        run: SPARSE_ENGINE=rust python -m tests.parallel
      - name: 静的検査（Python）
        working-directory: tessera
        run: pyflakes sparse_engine tests examples bench*.py

  # Rust の単体テストと clippy は Python の版によらないので、Python のテストと並べて 1 回だけ回す
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7  # pyo3（nanashi_core）のビルドに使う
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tessera/native
      - name: Rust の単体テスト
        run: cargo test --release --workspace --manifest-path tessera/native/Cargo.toml
      - name: 静的検査（Rust）
        run: cargo clippy --release --workspace --all-targets --manifest-path tessera/native/Cargo.toml -- -D warnings

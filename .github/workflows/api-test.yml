name: api-test

# Start only when api/, proto/ (the validation rules), mise.toml or this file changes.
on:
  push:
    branches: [main]
    paths: &paths
      - api/**
      - proto/**
      - mise.toml
      - .github/workflows/api-test.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nanashi
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NANASHI_PG_DSN: postgresql://postgres@127.0.0.1:55432/nanashi
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5  # Use the versions in mise.toml
        with:
          install_args: go
      - name: Test
        working-directory: api
        run: |
          go vet ./...
          go test -count=1 ./...  # The database contents are not in the test cache key, so do not use the cache.

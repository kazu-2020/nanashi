name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-10-19 に Ubuntu 26 へ移るので、版を固定する
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14t"]  # 通常の Python と free-threaded の Python
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nanashi
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: 依存を入れて Rust のエンジンをビルドする
        run: |
          sudo apt-get install -y libpq5  # 純 Python 版の psycopg が使う
          python -m pip install -e ".[dev]"
          python -m pip install --no-build-isolation ./native  # maturin でビルドして入れる（仮想環境は要らない）
      - name: 参照実装でテストする
        run: SPARSE_ENGINE=reference python -m unittest discover -s tests -t .
      - name: Rust のエンジンでテストする
        run: SPARSE_ENGINE=rust python -m unittest discover -s tests -t .
        env:
          NANASHI_PG_DSN: postgresql://postgres@127.0.0.1:55432/nanashi
      - name: Rust の単体テスト
        run: cargo test --release --manifest-path native/Cargo.toml
      - name: 静的検査
        run: |
          pyflakes sparse_engine tests examples bench*.py
          cargo clippy --release --all-targets --manifest-path native/Cargo.toml -- -D warnings

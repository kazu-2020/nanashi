name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14t"]  # 通常の Python と free-threaded の Python
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nanashi
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: 依存を入れて Rust のエンジンをビルドする
        run: |
          python -m pip install -e ".[dev]"
          maturin develop --release -m native/Cargo.toml
      - name: 参照実装でテストする
        run: SPARSE_ENGINE=reference python -m unittest discover -s tests -t .
      - name: Rust のエンジンでテストする
        run: SPARSE_ENGINE=rust python -m unittest discover -s tests -t .
        env:
          NANASHI_PG_DSN: postgresql://postgres@127.0.0.1:55432/nanashi
      - name: 静的検査
        run: pyflakes sparse_engine tests examples bench*.py

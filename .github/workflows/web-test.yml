name: web-test

# Start only when web/, proto/, the generated code, mise.toml or this file changes.
# This workflow also makes sure that the generated code in api/gen/ and web/src/gen/ agrees with proto/.
on:
  push:
    branches: [main]
    paths: &paths
      - web/**
      - proto/**
      - api/gen/**
      - api/go.mod  # The versions of the Go plugins
      - api/go.sum
      - buf.yaml
      - buf.gen.yaml
      - mise.toml
      - .github/workflows/web-test.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Use the versions in mise.toml. buf generate runs the Go plugins with "go tool".
      - uses: jdx/mise-action@v5
        with:
          install_args: node npm:pnpm go
      - name: Cache the Go modules and the build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.workflow }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'api/go.sum') }}
          restore-keys: go-${{ github.workflow }}-${{ runner.os }}-
      - name: Find the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('mise.toml', 'web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Make sure that the generated code is up to date
        run: |
          pnpm generate
          test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }
      - run: pnpm exec buf lint ..
      - run: pnpm exec vp check
      - run: pnpm exec vp test run
      - run: pnpm build

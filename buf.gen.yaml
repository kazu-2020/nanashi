# Make the code from proto/: in web/, run "pnpm generate".
# The plugins run locally, so that the result does not change with the network.
version: v2
clean: true
plugins:
  - local: [go, tool, -C, api, protoc-gen-go]
    out: api/gen
    opt: paths=source_relative
  - local: [go, tool, -C, api, protoc-gen-connect-go]
    out: api/gen
    opt: paths=source_relative
  # The TypeScript code of buf/validate comes from the BSR dependency, so include the imports.
  # The Go code of buf/validate comes from the Go module of protovalidate.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
    include_imports: true

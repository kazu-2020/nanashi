[package]
name = "nanashi_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "nanashi_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
numpy = "0.29"
rayon = "1.12"
rustc-hash = "2.1"
imbl = "7.0"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
bytes = "1"

[profile.release]
lto = "thin"

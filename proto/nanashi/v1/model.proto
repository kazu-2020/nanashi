syntax = "proto3";

package nanashi.v1;

option go_package = "github.com/kazu-2020/nanashi/api/gen/nanashi/v1;nanashiv1";

// ModelService gives the models to the frontend.
service ModelService {
  // ListModels returns all the models in the journal, in the order of the model ID.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {}
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message Model {
  string id = 1;
  // True if a writer holds a lease that is not expired.
  bool open = 2;
}

syntax = "proto3";

package nanashi.v1;

option go_package = "github.com/kazu-2020/nanashi/api/gen/nanashi/v1;nanashiv1";

// PlanService gives the planning features to the frontend.
// The header X-Nanashi-User identifies the user. The API trusts it only on a connection from this host
// (local development) or from an authenticating proxy that sets it again (--trusted-proxy).
// Each application is one engine model.
//
// Identifiers (docs/ids.md). Each id that a request or a response carries is a UUIDv7. The frontend makes the id
// of each new object (list, member, property, Metric, table, view, board, comment, access rule, snapshot,
// application). The api makes the ids of the objects that it makes for the user (the calendar, the scenario
// list, the members of an import, the Metric of a NUMBER or BOOLEAN property). A name is an attribute.
// Every reference (the dimensions of a Metric, a filter, a cell, a rule) is an id. The api changes each id to
// the canonical form (lower case, with hyphens) and refuses a value that is not a UUID with INVALID_ARGUMENT.
//
// Each request that changes data has client_op_id: a UUID that the frontend makes once for each user action.
// A request sent again with the same client_op_id gives the stored result of the first send. A request with the
// same client_op_id and a different content gives INVALID_ARGUMENT.
service PlanService {
  // Applications.
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse) {}
  // CreateApplication makes an empty application, or restores a snapshot into a new application.
  rpc CreateApplication(CreateApplicationRequest) returns (Application) {}

  // Modeling.
  rpc GetModel(GetModelRequest) returns (ModelDef) {}
  rpc CreateList(CreateListRequest) returns (Ack) {}
  // RenameList changes the name of a list. It also renames the Metric "<list>.<property>" of each NUMBER or
  // BOOLEAN property.
  rpc RenameList(RenameListRequest) returns (Ack) {}
  rpc AddProperty(AddPropertyRequest) returns (Ack) {}
  // RenameProperty changes the name of a property. The name of a NUMBER or BOOLEAN property is also in the name
  // of its Metric "<list>.<property>".
  rpc RenameProperty(RenamePropertyRequest) returns (Ack) {}
  rpc EditMembers(EditMembersRequest) returns (Ack) {}
  rpc CreateCalendar(CreateCalendarRequest) returns (Ack) {}
  // CreateScenario adds a member to the scenario list (it makes the list on the first call) and copies the
  // input cells of copy_from.
  rpc CreateScenario(CreateScenarioRequest) returns (Ack) {}
  // CreateMetric makes a Metric. An empty formula makes an input Metric. An existing id gives ALREADY_EXISTS.
  rpc CreateMetric(CreateMetricRequest) returns (Ack) {}
  // UpdateMetric changes a Metric. A missing id gives NOT_FOUND.
  // It keeps the name (RenameMetric changes it). A change to the dimensions, the kind or the formula of
  // an input Metric deletes its cells.
  rpc UpdateMetric(UpdateMetricRequest) returns (Ack) {}
  rpc RenameMetric(RenameMetricRequest) returns (Ack) {}
  rpc DeleteMetric(DeleteMetricRequest) returns (Ack) {}

  // Data.
  rpc Query(QueryRequest) returns (QueryResponse) {}
  // WriteCells sets a cell, or spreads a value if the coordinates do not give all dimensions.
  rpc WriteCells(WriteCellsRequest) returns (Ack) {}
  rpc Import(ImportRequest) returns (ImportResponse) {}

  // Tables, views and boards.
  // A Create RPC gives ALREADY_EXISTS if the id exists. An Update RPC gives NOT_FOUND if the id does not exist.
  rpc CreateTable(CreateTableRequest) returns (Ack) {}
  rpc UpdateTable(UpdateTableRequest) returns (Ack) {}
  rpc CreateView(CreateViewRequest) returns (Ack) {}
  rpc UpdateView(UpdateViewRequest) returns (Ack) {}
  rpc CreateBoard(CreateBoardRequest) returns (Ack) {}
  rpc UpdateBoard(UpdateBoardRequest) returns (Ack) {}
  rpc DeleteItem(DeleteItemRequest) returns (Ack) {}

  // Collaboration.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {}
  rpc AddComment(AddCommentRequest) returns (Comment) {}
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse) {}
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {}
  rpc CreateSnapshot(CreateSnapshotRequest) returns (Snapshot) {}

  // Access rights. Only an ADMIN can change them.
  rpc GetAccess(GetAccessRequest) returns (Access) {}
  rpc SetMemberRole(SetMemberRoleRequest) returns (Ack) {}
  rpc CreateAccessRule(CreateAccessRuleRequest) returns (Ack) {}
  rpc UpdateAccessRule(UpdateAccessRuleRequest) returns (Ack) {}
  rpc DeleteAccessRule(DeleteAccessRuleRequest) returns (Ack) {}
}

message Ack {}

// Role is the role of a user in an application. A higher role has all the rights of a lower role.
enum Role {
  ROLE_UNSPECIFIED = 0; // No access.
  ROLE_VIEWER = 1; // Reads data.
  ROLE_CONTRIBUTOR = 2; // Also writes input cells and imports data.
  ROLE_MODELER = 3; // Also changes lists, Metrics, tables, views and boards.
  ROLE_ADMIN = 4; // Also changes access rights and members.
}

message Application {
  string id = 1;
  string name = 2;
  Role role = 3;
}

message ListApplicationsRequest {}

message ListApplicationsResponse {
  repeated Application applications = 1;
}

message CreateApplicationRequest {
  string name = 1;
  // If set, the new application starts with the content of this snapshot.
  string snapshot_id = 2;
  // The id of the new application.
  string id = 3;
  string client_op_id = 4;
}

message GetModelRequest {
  string app_id = 1;
}

enum ListKind {
  LIST_KIND_UNSPECIFIED = 0;
  LIST_KIND_DIMENSION = 1;
  LIST_KIND_TRANSACTION = 2;
  LIST_KIND_CALENDAR = 3;
  LIST_KIND_SCENARIO = 4;
}

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  // A member of the list in target. Formulas use it with BY.
  PROPERTY_TYPE_DIMENSION = 1;
  // A number. It is the input Metric "<list>.<property>" on the list.
  PROPERTY_TYPE_NUMBER = 2;
  // TRUE or FALSE. It is the input Metric "<list>.<property>" on the list.
  PROPERTY_TYPE_BOOLEAN = 3;
  // Text. Formulas cannot use it.
  PROPERTY_TYPE_TEXT = 4;
}

message PropertyDef {
  string id = 4;
  string name = 1;
  PropertyType type = 2;
  // The id of the target list of a DIMENSION property.
  string target = 3;
}

message Member {
  string id = 3;
  string name = 1;
  // The value of each property, by property id. The value of a DIMENSION property is a member id of the target
  // list. The other values are text. A blank value is missing.
  map<string, string> properties = 2;
}

message ListDef {
  string id = 6;
  string name = 1;
  ListKind kind = 2;
  reserved 3;
  // The members in their order. Access rules can hide members.
  repeated Member members = 4;
  repeated PropertyDef properties = 5;
}

// ValueKind is the type of the values of a Metric.
enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0; // NUMBER.
  VALUE_KIND_NUMBER = 1;
  VALUE_KIND_BOOLEAN = 2;
  VALUE_KIND_MEMBER = 3; // A member of MetricDef.member_list.
}

message MetricDef {
  string id = 7;
  string name = 1;
  // The ids of the lists.
  repeated string dimensions = 2;
  ValueKind kind = 3;
  // The id of the list of a MEMBER Metric. Empty for the other kinds.
  string member_list = 6;
  // Empty for an input Metric. A formula names the Metrics, lists and members by their names.
  string formula = 4;
  // True if a user can type over the formula result.
  bool overridable = 5;
  // The catalog attributes (app_metric). The api keeps them, not the engine.
  string description = 8;
  string folder = 9;
  // The user who made the Metric. Output only: the api ignores it in a request.
  string owner = 10;
}

message ModelDef {
  reserved 1;
  reserved "seq";
  Role role = 2;
  repeated ListDef lists = 3;
  repeated MetricDef metrics = 4;
  repeated TableDef tables = 5;
  repeated ViewDef views = 6;
  repeated BoardDef boards = 7;
}

message NewMember {
  string id = 1;
  string name = 2;
}

message CreateListRequest {
  string app_id = 1;
  string id = 6;
  string name = 2;
  ListKind kind = 3;
  repeated NewMember members = 4;
  string client_op_id = 5;
}

message RenameListRequest {
  string app_id = 1;
  string id = 2;
  string name = 3;
  string client_op_id = 4;
}

message AddPropertyRequest {
  string app_id = 1;
  // The id of the list.
  string list = 2;
  // property.id is required. The api makes the id of the Metric of a NUMBER or BOOLEAN property.
  PropertyDef property = 3;
  string client_op_id = 4;
}

message RenamePropertyRequest {
  string app_id = 1;
  // The id of the list.
  string list = 2;
  // The id of the property.
  string id = 3;
  string name = 4;
  string client_op_id = 5;
}

message EditMembersRequest {
  string app_id = 1;
  // The id of the list.
  string list = 2;
  repeated MemberEdit edits = 3;
  string client_op_id = 4;
}

message MemberEdit {
  oneof edit {
    AddMember add = 1;
    RenameMember rename = 2;
    RemoveMember remove = 3;
    MoveMember move = 4;
    SetProperties set = 5;
  }
}

message AddMember {
  string id = 3;
  string name = 1;
  // Property id to value (see Member.properties).
  map<string, string> properties = 2;
}

message RenameMember {
  string id = 1;
  string name = 2;
}

message RemoveMember {
  string id = 1;
}

message MoveMember {
  string id = 1;
  int32 position = 2;
}

// SetProperties sets property values of a member. An empty value makes the value blank.
message SetProperties {
  string id = 1;
  map<string, string> properties = 2;
}

// CreateCalendar makes the ordered lists Year, Quarter and Month with the properties
// Month.Quarter, Month.Year and Quarter.Year. Member names are "2026", "2026-Q1" and "2026-01".
// The api makes the ids.
message CreateCalendarRequest {
  string app_id = 1;
  int32 start_year = 2;
  int32 years = 3;
  string client_op_id = 4;
}

message CreateScenarioRequest {
  string app_id = 1;
  // The id of the new member.
  string id = 5;
  string name = 2;
  // The id of an existing scenario member. Empty gives an empty scenario.
  string copy_from = 3;
  string client_op_id = 4;
}

message CreateMetricRequest {
  string app_id = 1;
  string client_op_id = 2;
  // metric.id is required.
  MetricDef metric = 3;
}

message UpdateMetricRequest {
  string app_id = 1;
  string client_op_id = 2;
  MetricDef metric = 3;
}

message RenameMetricRequest {
  string app_id = 1;
  string id = 2;
  string name = 3;
  string client_op_id = 4;
}

message DeleteMetricRequest {
  string app_id = 1;
  string id = 2;
  string client_op_id = 3;
}

// Members is a set of member ids.
message Members {
  repeated string ids = 1;
}

message Value {
  oneof value {
    double number = 1;
    bool boolean = 2;
    // A member id.
    string member = 3;
  }
}

// Aggregation is how a Query combines the cells of a number Metric.
enum Aggregation {
  AGGREGATION_UNSPECIFIED = 0; // SUM.
  AGGREGATION_SUM = 1;
  AGGREGATION_AVG = 2;
  AGGREGATION_MIN = 3;
  AGGREGATION_MAX = 4;
  AGGREGATION_COUNT = 5;
}

// QueryRequest reads the cells of Metrics, aggregated to the lists in rows and columns. All references are ids.
// The response ignores a list that a Metric does not have, and a Metric that the model does not have.
message QueryRequest {
  string app_id = 1;
  repeated string metrics = 2;
  repeated string rows = 3;
  repeated string columns = 4;
  // Only these members, by list id. A missing list gives all members.
  map<string, Members> filters = 5;
  // It is used only for number Metrics.
  Aggregation aggregation = 6;
}

message QueryCell {
  string metric = 1;
  // The member id of each list in QueryResponse.dimensions. Empty if the Metric does not have the list.
  repeated string coords = 2;
  Value value = 3;
}

message QueryResponse {
  reserved 1;
  // The list ids of QueryCell.coords: the rows, then the columns.
  repeated string dimensions = 2;
  repeated QueryCell cells = 3;
}

message CellWrite {
  string metric = 1;
  // List id to member id.
  map<string, string> coords = 2;
  // Missing makes the cell blank.
  Value value = 3;
}

message WriteCellsRequest {
  string app_id = 1;
  repeated CellWrite writes = 2;
  string client_op_id = 3;
}

// ImportRequest loads a CSV file (with a header row) into a list or a Metric.
message ImportRequest {
  string app_id = 1;
  string csv = 2;
  string client_op_id = 5;
  oneof target {
    ListImport list = 3;
    MetricImport metric = 4;
  }
}

message ListImport {
  // The id of the list.
  string list = 1;
  // The column with the member names. Empty for a transaction list gives the row numbers.
  string member_column = 2;
  // Property id to column name. The column of a DIMENSION property has member names of the target list.
  map<string, string> property_columns = 3;
}

message MetricImport {
  // The id of the Metric.
  string metric = 1;
  // List id to column name. The column has member names.
  map<string, string> dimension_columns = 2;
  string value_column = 3;
  // If true, add the members that are not in the lists. If false, such rows are errors.
  bool add_members = 4;
}

message ImportResponse {
  int32 rows = 1;
}

message CreateTableRequest {
  string app_id = 1;
  string client_op_id = 2;
  // table.id is required.
  TableDef table = 3;
}

message UpdateTableRequest {
  string app_id = 1;
  string client_op_id = 2;
  TableDef table = 3;
}

message TableDef {
  string app_id = 1;
  string id = 2;
  string name = 3;
  // Metric ids.
  repeated string metrics = 4;
}

enum Display {
  DISPLAY_UNSPECIFIED = 0; // A grid.
  DISPLAY_GRID = 1;
  DISPLAY_LINE = 2;
  DISPLAY_BAR = 3;
  DISPLAY_KPI = 4;
}

// ViewDef is a saved pivot of Metrics.
message CreateViewRequest {
  string app_id = 1;
  string client_op_id = 2;
  // view.id is required.
  ViewDef view = 3;
}

message UpdateViewRequest {
  string app_id = 1;
  string client_op_id = 2;
  ViewDef view = 3;
}

message ViewDef {
  string app_id = 1;
  string id = 2;
  string name = 3;
  repeated string metrics = 4;
  repeated string rows = 5;
  repeated string columns = 6;
  map<string, Members> filters = 7;
  Display display = 8;
  Aggregation aggregation = 9;
}

message Widget {
  oneof content {
    string view_id = 1;
    string text = 2;
  }
}

message CreateBoardRequest {
  string app_id = 1;
  string client_op_id = 2;
  // board.id is required.
  BoardDef board = 3;
}

message UpdateBoardRequest {
  string app_id = 1;
  string client_op_id = 2;
  BoardDef board = 3;
}

message BoardDef {
  string app_id = 1;
  string id = 2;
  string name = 3;
  repeated Widget widgets = 4;
  // Lists with a page selector. The selected member filters all the widgets.
  repeated string page_selectors = 5;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_TABLE = 1;
  ITEM_TYPE_VIEW = 2;
  ITEM_TYPE_BOARD = 3;
}

message DeleteItemRequest {
  string app_id = 1;
  ItemType type = 2;
  string id = 3;
  string client_op_id = 4;
}

message AddCommentRequest {
  string app_id = 1;
  string client_op_id = 2;
  // comment.id is required.
  Comment comment = 3;
}

message Comment {
  string app_id = 1;
  string id = 2;
  // The id of the Metric of the comment.
  string metric = 3;
  // The cell, as list id to member id. Empty for the whole Metric.
  map<string, string> cell = 4;
  string user = 5;
  string body = 6;
  // Unix time in milliseconds.
  int64 created_at = 7;
}

message ListCommentsRequest {
  string app_id = 1;
  // Empty gives all comments of the application.
  string metric = 2;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

message AuditEntry {
  string id = 1;
  string user = 2;
  int64 created_at = 3;
  // The RPC name, for example "WriteCells".
  string action = 4;
  // The request as JSON.
  string detail = 5;
}

message ListAuditRequest {
  string app_id = 1;
  int32 limit = 2;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
}

message Snapshot {
  string id = 1;
  string name = 2;
  string user = 3;
  int64 created_at = 4;
}

message ListSnapshotsRequest {
  string app_id = 1;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message CreateSnapshotRequest {
  string app_id = 1;
  string name = 2;
  // The id of the new snapshot.
  string id = 3;
  string client_op_id = 4;
}

message GetAccessRequest {
  string app_id = 1;
}

message SetMemberRoleRequest {
  string app_id = 1;
  string client_op_id = 2;
  AppMember member = 3;
}

message AppMember {
  string app_id = 1;
  string user = 2;
  // ROLE_UNSPECIFIED removes the user from the application.
  Role role = 3;
}

message CreateAccessRuleRequest {
  string app_id = 1;
  string client_op_id = 2;
  // rule.id is required.
  AccessRule rule = 3;
}

message UpdateAccessRuleRequest {
  string app_id = 1;
  string client_op_id = 2;
  AccessRule rule = 3;
}

// AccessRule limits the members of a list that the users with a role can read and write.
// A user with more than one rule must agree with all of them. MODELER and ADMIN ignore rules.
// A member that the model does not have is not readable. A list that the model does not have makes the rule
// inactive.
message AccessRule {
  string app_id = 1;
  string id = 2;
  Role role = 3;
  // The id of the list.
  string list = 4;
  // Member ids.
  repeated string members = 5;
  // If false, the users can read the members but cannot write.
  bool write = 6;
}

message DeleteAccessRuleRequest {
  string app_id = 1;
  string id = 2;
  string client_op_id = 3;
}

message Access {
  repeated AppMember members = 1;
  repeated AccessRule rules = 2;
}
